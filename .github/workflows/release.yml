name: Official release workflows

# The committer creates and selects an existing release tag.
# Publication and SBOM workflows attach to that release; this dispatcher creates no tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    if: github.repository == 'eclipse-xfsc/facis-fap-principal-credential-issuance'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the committer-selected source tag
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          if [[ "$(cat VERSION)" != *-* ]]; then
            node tools/signoff-gate.mjs docs/release/acceptance.json
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install PyYAML==6.0.2
          npm test

  dispatch-delivery:
    needs: source-gate
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Run delivery workflows on that existing tag
        run: |
          set -euo pipefail
          for workflow in ci.yml security-scans.yml eclipse-dash.yml image.yml release-sbom.yml release-go-sbom.yml release-python-sbom.yml release-container-sbom.yml; do
            gh workflow run "$workflow" --ref "$GITHUB_REF_NAME"
          done
          gh workflow run docs.yml --ref "$GITHUB_REF_NAME" -f publish=true
