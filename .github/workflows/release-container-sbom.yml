name: Release Container SBOM

# Reuse SBOMs from the tested, published images instead of rebuilding another image.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-container-sbom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    if: github.repository == 'eclipse-xfsc/facis-fap-principal-credential-issuance'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve published image evidence from the existing release
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          mkdir -p container-evidence
          found=false
          for attempt in $(seq 1 60); do
            if gh release download "$RELEASE_TAG" --dir container-evidence --clobber \
              -p 'publication-*.json' -p 'sbom-*.cdx.json' -p 'image-*.json' -p 'scan-*.json' -p startup-check.log; then
              if test -f container-evidence/publication-application.json && test -f container-evidence/publication-participant.json; then
                found=true
                break
              fi
            fi
            sleep 10
          done
          test "$found" = true || { echo '::error::Wait for successful Images publication and release attachment, then rerun this workflow.'; exit 1; }
      - name: Verify the published source and evidence checksums
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('container-evidence')
          for kind in ('application', 'participant'):
              receipt = json.loads((root / ('publication-' + kind + '.json')).read_text())
              if receipt['sourceCommit'] != os.environ['GITHUB_SHA']:
                  raise SystemExit('Image publication source does not match the selected tag.')
              for name, expected in receipt['evidenceSha256'].items():
                  if Path(name).name != name:
                      raise SystemExit('Unsafe evidence filename.')
                  if hashlib.sha256((root / name).read_bytes()).hexdigest() != expected:
                      raise SystemExit('Published image evidence checksum mismatch.')
          print('Both published image SBOMs and their source/evidence receipts verified.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-container-sbom-${{ github.sha }}
          path: container-evidence/
          if-no-files-found: error
